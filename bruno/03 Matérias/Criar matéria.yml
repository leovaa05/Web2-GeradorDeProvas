info:
  name: Criar matéria
  type: http
  seq: 7
  tags:
    - atividade-04

http:
  method: POST
  url: "{{baseUrl}}/subjects"
  body:
    type: json
    data: |-
      {
        "nome": "Matemática",
        "professorId": 1
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("runId")) {
          bru.setVar("runId", `${Date.now()}-${Math.random().toString(16).slice(2)}`);
        }
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("subjectId", String(res.body.data.id));
        }
    - type: tests
      code: |-
        test("Cria uma matéria", function() {
          expect(res.status).to.equal(201);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.have.property("id");
          expect(res.body.data).to.have.property("professor");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
